name: AI Review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  ai-review:
    # Code Tribunal v3.1.1
    uses: seanleecoder/code-tribunal/.github/workflows/ai-review-reusable.yml@37b1fcca602b4c1b87d66285171822b9e9ed06c5
    with:
      pr_number: ${{ inputs.pr_number || '' }}
    secrets: inherit
