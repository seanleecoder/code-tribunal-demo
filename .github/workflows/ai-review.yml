name: AI Review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  ai-review:
    # Code Tribunal v3.1.0
    uses: seanleecoder/code-tribunal/.github/workflows/ai-review-reusable.yml@ef8a13b49c08e625b026f391c646f51a0d012888
    with:
      pr_number: ${{ inputs.pr_number || '' }}
    secrets: inherit
